<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>رصد — لا يوجد اتصال</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Tahoma, Arial, sans-serif; background: #f8fafc; color: #0f172a; }
      main { text-align: center; padding: 24px; max-width: 360px; }
      img { width: 96px; height: 96px; }
      h1 { font-size: 22px; margin: 16px 0 8px; }
      p { color: #475569; line-height: 1.8; }
      button { margin-top: 16px; padding: 12px 24px; font-size: 16px; border: 0; border-radius: 12px; background: #0f172a; color: #fff; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="" />
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>عمليات التسليم التي سجّلتها محفوظة على هذا الجهاز وستُرسل تلقائياً عند عودة الاتصال.</p>
      <button onclick="location.reload()">إعادة المحاولة</button>
    </main>
  </body>
</html>
