# فحص تلقائي مجاني على GitHub عند كل push و Pull Request:
# فحص الأنواع + 35 اختباراً على PostgreSQL حقيقي + بناء الإنتاج
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rasd
          POSTGRES_PASSWORD: rasd
          POSTGRES_DB: rasd_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rasd" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://rasd:rasd@localhost:5432/rasd_test?schema=public
      DIRECT_URL: postgresql://rasd:rasd@localhost:5432/rasd_test?schema=public
      TEST_DATABASE_URL: postgresql://rasd:rasd@localhost:5432/rasd_test?schema=public
      AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-ci
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
